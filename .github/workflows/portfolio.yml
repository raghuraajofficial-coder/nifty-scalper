name: Paper portfolio
on:
  schedule:
    # GitHub often delays or skips scheduled runs, so several are queued after the market close.
    # A run that finds no new trading day changes nothing, so the extra ones are harmless.
    - cron: "17 12 * * 1-5"   # 17:47 IST
    - cron: "47 13 * * 1-5"   # 19:17 IST
    - cron: "17 15 * * 1-5"   # 20:47 IST
    - cron: "17 17 * * 1-5"   # 22:47 IST
    - cron: "17 1 * * 2-6"    # 06:47 IST next morning, a last catch-up before the market opens
  workflow_dispatch:
  push:
    paths:
      - portfolio.py
      - .github/workflows/portfolio.yml
permissions:
  contents: write
concurrency:
  group: portfolio
  cancel-in-progress: false
jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python portfolio.py
      - name: Save results
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add docs/portfolio.json
          git diff --cached --quiet && exit 0
          git commit -m "Paper portfolio $(TZ=Asia/Kolkata date '+%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
