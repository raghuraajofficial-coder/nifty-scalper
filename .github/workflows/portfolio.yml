name: Paper portfolio
on:
  schedule:
    - cron: "30 12 * * 1-5"   # 18:00 IST on weekdays, after the market close
  workflow_dispatch:
  push:
    paths:
      - portfolio.py
      - .github/workflows/portfolio.yml
permissions:
  contents: write
concurrency:
  group: portfolio
  cancel-in-progress: false
jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python portfolio.py
      - name: Save results
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add docs/portfolio.json
          git diff --cached --quiet && exit 0
          git commit -m "Paper portfolio $(TZ=Asia/Kolkata date '+%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
