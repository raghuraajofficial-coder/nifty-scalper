name: ORB backtest
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python orb.py backtest
      - name: Save results
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add docs/orb_backtest.json docs/data.json
          git diff --cached --quiet || (git commit -m "ORB backtest" && git push)
